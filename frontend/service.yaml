apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: dso202-assignment-02
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: task-tracker
    tier: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
    tier: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080         # matches extraPortMappings in kind-config.yaml
