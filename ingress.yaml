apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-tracker-ingress
  namespace: dso202-assignment-02
  labels:
    app.kubernetes.io/part-of: task-tracker
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tasktracker.localtest.me
      secretName: tasktracker-tls
  rules:
    - host: tasktracker.localtest.me
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 8080
