apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-reader
  namespace: dso202-assignment-02
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-reader-binding
  namespace: dso202-assignment-02
subjects:
  - kind: Group
    name: task-tracker-readers     # matches O= in the certificate
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: task-reader
  apiGroup: rbac.authorization.k8s.io
