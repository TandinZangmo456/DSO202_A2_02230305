apiVersion: v1
kind: Service
metadata:
  name: db-svc
  namespace: dso202-assignment-02
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: task-tracker
    tier: database
spec:
  clusterIP: None             # headless: DNS returns the Pod IP directly, no load-balancing
  selector:
    app.kubernetes.io/name: db
    tier: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
