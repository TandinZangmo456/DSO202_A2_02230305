apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: dso202-assignment-02
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: task-tracker
    tier: database
spec:
  serviceName: db-svc            # the existing headless Service gives db-0 a stable DNS name
  replicas: 1                    # identity and storage only; Postgres replication is not provided by Kubernetes
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: db
      tier: database
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain          # keep the data if the StatefulSet is deleted
    whenScaled: Retain           # keep the data if replicas are reduced
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
        app.kubernetes.io/part-of: task-tracker
        tier: database
    spec:
      serviceAccountName: db-sa
      containers:
        - name: postgres
          image: sarojsanyasi/dso202-db:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:          # one PVC per replica, named data-db-<ordinal>
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
